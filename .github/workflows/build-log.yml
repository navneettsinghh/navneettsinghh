name: NAVNEET.OS Build Log

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate build log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-log.mjs
      - name: Commit generated asset
        run: |
          git config user.name 'NAVNEET.OS'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/build-log.svg
          git diff --cached --quiet || git commit -m 'chore(profile): refresh build log'
          git push
