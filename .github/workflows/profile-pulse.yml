name: NAVNEET.OS Profile Pulse

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate live profile telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/profile-pulse.mjs

      - name: Commit refreshed pulse
        run: |
          git config user.name 'NAVNEET.OS'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-pulse.svg
          git diff --cached --quiet || git commit -m 'chore(profile): refresh live pulse'
          git push
